<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <h1>Sudoku Game</h1>

    <div class="toolbar">
      <label class="field" for="difficulty-select">
        <span>Difficulty</span>
        <select id="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <label class="field" for="player-name">
        <span>Player</span>
        <input id="player-name" type="text" maxlength="20" value="Player" aria-label="Player name">
      </label>

      <div class="field timer-box" aria-live="polite">
        <span>Time</span>
        <strong id="timer-display">00:00</strong>
      </div>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        Dark mode
      </button>
    </div>

    <div id="sudoku-board" aria-label="Sudoku board"></div>

    <div class="controls">
      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check Solution</button>
      <button id="hint-move" type="button">Hint</button>
      <span id="message" aria-live="polite"></span>
    </div>

    <section class="scoreboard" aria-labelledby="scoreboard-header">
      <h2 id="scoreboard-header">Top 10 Scores</h2>
      <ol id="scoreboard-list"></ol>
    </section>
  </main>

  <script src="/static/main.js"></script>
</body>
</html>
